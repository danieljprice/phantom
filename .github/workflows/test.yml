name: test

on:
  workflow_call:

env:
  PHANTOM_DIR: ${{ github.workspace }}
  PHANTOM_DATA_SOURCE: github  # download data files from the GitHub mirror before Zenodo
  OMP_STACKSIZE: 512M
  OMP_NUM_THREADS: 4

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        system:
          - gfortran
          - ifort
          - ifx
          - nvfortran
        debug:
          - no
          - yes
        input: # [SETUP, phantom_tests, 'nodata' to unset PHANTOM_DIR so tests needing data files are skipped]
          - ['test', '', '']
          - ['testkd', '', '']
          - ['testdust', 'dust', '']
          - ['testgr', 'gr ptmass eos', '']
          - ['testgrav', 'gravity ptmass setstar sinktree', '']
          - ['testgrowth', 'dustgrowth', '']
          - ['testnimhd', 'nimhd', '']
          - ['test2', '', 'nodata']
          - ['testcyl', '', '']
          - ['testapr', '', '']

    name: |
      test (SYSTEM=${{ matrix.system }},
            DEBUG=${{ matrix.debug }},
            SETUP=${{ matrix.input[0] }},
            targets=${{ matrix.input[1] }})

    runs-on: ubuntu-latest

    steps:

    - name: "Nuke the github workspace before doing anything"
      run: rm -r ${{ github.workspace }} && mkdir ${{ github.workspace }}

    - name: Setup Fortran compiler
      if: matrix.system == 'ifort' || matrix.system == 'ifx' || matrix.system == 'nvfortran'
      uses: fortran-lang/setup-fortran@v1
      with:
          compiler: ${{ matrix.system == 'ifort' && 'intel-classic' || matrix.system == 'ifx' && 'intel' || 'nvidia-hpc' }}

    - name: "Clone phantom"
      uses: actions/checkout@v4

    - name: "Compile phantom"
      run: make SETUP=${{ matrix.input[0] }} DEBUG=${{ matrix.debug }} phantomtest
      env:
        SYSTEM: ${{ matrix.system }}

    - name: "Cache downloaded data files"
      if: matrix.input[2] != 'nodata'
      uses: actions/cache@v4
      with:
        # exact key only: a stale table must never be restored when the data source changes
        key: eos-datafiles-${{ hashFiles('src/main/datafiles.f90') }}
        path: |
          data/eos/*/*
          !data/eos/*/README
          data/star_data_files/pourmandwd.data*

    - name: "Run phantom tests"
      run: ./bin/phantomtest ${{ matrix.input[1] }}
      env:
        PHANTOM_DIR: ${{ matrix.input[2] != 'nodata' && github.workspace || '' }}
