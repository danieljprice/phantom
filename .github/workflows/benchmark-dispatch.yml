name: benchmark-dispatch

# Asks the benchmark suite (phantomSPH/phantom-benchmarks) to run on GitHub-hosted runners
# for each push to main. Uses a GitHub App installed on phantomSPH/phantom-benchmarks with
# Contents read/write permission: its client ID in the variable PHANTOMBENCH_APP_CLIENT_ID and
# its private key in the secret PHANTOMBENCH_APP_KEY. A short-lived token is created on each run.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions: {}

jobs:
  dispatch:
    # skipped where the app is not set up (e.g. in forks)
    if: vars.PHANTOMBENCH_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: create token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PHANTOMBENCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHANTOMBENCH_APP_KEY }}
          owner: phantomSPH
          repositories: phantom-benchmarks

      - name: trigger benchmarks
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api repos/phantomSPH/phantom-benchmarks/dispatches \
             -f event_type=phantom-push -f "client_payload[sha]=$GITHUB_SHA"
